<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סימולציה גרסה 6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-muted: #f1f5f9;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #10b981;
            --primary-hover: #059669;
            --primary-soft: rgba(16, 185, 129, 0.12);
            --user-bubble: #0f172a;
            --user-text: #ffffff;
            --shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.08);
            --radius: 18px;
        }

        body.dark-mode {
            --bg: #0b1120;
            --surface: #111827;
            --surface-muted: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --primary: #34d399;
            --primary-hover: #10b981;
            --primary-soft: rgba(52, 211, 153, 0.14);
            --user-bubble: #10b981;
            --user-text: #052e16;
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Heebo', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        header {
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            padding: 14px 20px;
        }

        .header-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-soft);
        }

        .brand h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface-muted);
            color: var(--text);
            text-decoration: none;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
        }

        .nav-btn:hover {
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        main {
            flex: 1;
            min-height: 0;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 16px 20px;
            gap: 14px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 8px 4px;
        }

        .empty-state {
            margin: auto;
            text-align: center;
            max-width: 520px;
            padding: 24px 12px;
        }

        .empty-state h2 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 0.96rem;
            margin-bottom: 18px;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .suggestion-chip {
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 999px;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .suggestion-chip:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            gap: 6px;
        }

        .message-row.user {
            align-self: flex-start;
        }

        .message-row.assistant {
            align-self: flex-end;
            width: 100%;
            max-width: 85%;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: var(--radius);
            line-height: 1.65;
            font-size: 0.97rem;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message-row.user .bubble {
            background: var(--user-bubble);
            color: var(--user-text);
            border-bottom-right-radius: 6px;
        }

        .message-row.assistant .bubble {
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            border-bottom-left-radius: 6px;
        }

        .message-row.error .bubble {
            border-color: #ef4444;
            color: #dc2626;
        }

        body.dark-mode .message-row.error .bubble {
            color: #fca5a5;
        }

        .svg-card {
            margin-top: 10px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #ffffff;
            overflow: hidden;
        }

        .svg-preview {
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 120px;
            background: #ffffff;
            color: #0f172a;
        }

        .svg-preview svg {
            max-width: 100%;
            max-height: 340px;
            height: auto;
            display: block;
        }

        .svg-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: var(--surface-muted);
            border-top: 1px solid var(--border);
            gap: 8px;
        }

        .svg-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .svg-actions {
            display: flex;
            gap: 6px;
        }

        .mini-btn {
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
        }

        .mini-btn:hover {
            border-color: var(--primary);
        }

        .svg-code {
            display: none;
            direction: ltr;
            text-align: left;
            background: #0f172a;
            color: #e2e8f0;
            padding: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.8rem;
            overflow-x: auto;
            white-space: pre;
            border-top: 1px solid var(--border);
        }

        .svg-code.open {
            display: block;
        }

        .composer {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 12px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        .composer textarea {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-family: inherit;
            font-size: 0.98rem;
            line-height: 1.5;
            resize: none;
            max-height: 160px;
            padding: 6px 4px;
        }

        .send-btn {
            border: none;
            background: var(--primary);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.94rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease, opacity 0.2s ease;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .send-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .message-row,
            .message-row.assistant {
                max-width: 96%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="brand">
                <span class="brand-dot" aria-hidden="true"></span>
                <h1>סימולציה גרסה 6</h1>
            </div>
            <nav class="nav-actions" aria-label="ניווט בין דפים">
                <a href="landing.html" class="nav-btn">הדף המקורי</a>
                <a href="tic-tac-toe.html" class="nav-btn">איקס עיגול 🎮</a>
                <button type="button" class="nav-btn" id="themeToggle" onclick="toggleTheme()" aria-pressed="false">
                    <span id="themeIcon" aria-hidden="true">🌙</span>
                    <span id="themeText">מצב לילה</span>
                </button>
            </nav>
        </div>
    </header>

    <main>
        <div class="chat-messages" id="chatMessages" aria-live="polite">
            <div class="empty-state" id="emptyState">
                <h2>ברוך הבא לסימולציה</h2>
                <p>אפשר להתכתב כאן בחופשיות, ואפשר גם לבקש לצייר צורות, תרשימים וגרפיקה ב-SVG.</p>
                <div class="suggestions">
                    <button type="button" class="suggestion-chip" onclick="useSuggestion('צייר מקבילית')">צייר מקבילית</button>
                    <button type="button" class="suggestion-chip" onclick="useSuggestion('צייר משולש ישר זווית עם סימון צלעות וזווית ישרה')">צייר משולש ישר זווית</button>
                    <button type="button" class="suggestion-chip" onclick="useSuggestion('צייר תרשים זרימה פשוט של 3 שלבים')">תרשים זרימה</button>
                </div>
            </div>
        </div>

        <form class="composer" id="chatForm" onsubmit="handleSubmit(event)">
            <textarea
                id="messageInput"
                rows="1"
                placeholder="כתוב הודעה או בקש לצייר צורה (למשל: צייר מקבילית)..."
                required
            ></textarea>
            <button type="submit" class="send-btn" id="sendBtn">שלח</button>
        </form>
    </main>

    <script>
        const chatMessagesEl = document.getElementById('chatMessages');
        const emptyStateEl = document.getElementById('emptyState');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        const conversation = [];
        let isSending = false;

        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-mode');
            document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
            document.getElementById('themeText').textContent = isDark ? 'מצב יום' : 'מצב לילה';
            document.getElementById('themeToggle').setAttribute('aria-pressed', String(isDark));
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        if (localStorage.getItem('theme') === 'dark') {
            toggleTheme();
        }

        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 160) + 'px';
        });

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!isSending) {
                    document.getElementById('chatForm').requestSubmit();
                }
            }
        });

        function useSuggestion(text) {
            messageInput.value = text;
            messageInput.dispatchEvent(new Event('input'));
            document.getElementById('chatForm').requestSubmit();
        }

        function sanitizeSvg(rawSvg) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(rawSvg, 'image/svg+xml');
            const svg = doc.querySelector('svg');
            if (!svg || doc.querySelector('parsererror')) {
                return null;
            }

            // Strip potentially unsafe elements and event handler attributes
            svg.querySelectorAll('script, foreignObject, iframe, object, embed').forEach((el) => el.remove());

            const allElements = [svg, ...svg.querySelectorAll('*')];
            for (const el of allElements) {
                for (const attr of [...el.attributes]) {
                    const name = attr.name.toLowerCase();
                    const value = attr.value.trim().toLowerCase();
                    if (name.startsWith('on')) {
                        el.removeAttribute(attr.name);
                    } else if ((name === 'href' || name === 'xlink:href') && value.startsWith('javascript:')) {
                        el.removeAttribute(attr.name);
                    }
                }
            }

            return svg.outerHTML;
        }

        function extractParts(replyText) {
            // Match ```svg ... ``` or raw <svg ...>...</svg>
            const svgRegex = /```(?:svg|xml)?\s*(<svg[\s\S]*?<\/svg>)\s*```|(<svg[\s\S]*?<\/svg>)/gi;
            const parts = [];
            let lastIndex = 0;
            let match;

            while ((match = svgRegex.exec(replyText)) !== null) {
                const textBefore = replyText.slice(lastIndex, match.index).trim();
                if (textBefore) {
                    parts.push({ type: 'text', content: textBefore });
                }
                const svgRaw = match[1] || match[2];
                parts.push({ type: 'svg', content: svgRaw });
                lastIndex = svgRegex.lastIndex;
            }

            const trailingText = replyText.slice(lastIndex).trim();
            if (trailingText) {
                parts.push({ type: 'text', content: trailingText });
            }

            if (parts.length === 0) {
                parts.push({ type: 'text', content: replyText });
            }

            return parts;
        }

        function createSvgCard(rawSvg) {
            const cleanSvg = sanitizeSvg(rawSvg);
            if (!cleanSvg) {
                const pre = document.createElement('pre');
                pre.textContent = rawSvg;
                return pre;
            }

            const card = document.createElement('div');
            card.className = 'svg-card';

            const preview = document.createElement('div');
            preview.className = 'svg-preview';
            preview.innerHTML = cleanSvg;

            const toolbar = document.createElement('div');
            toolbar.className = 'svg-toolbar';

            const label = document.createElement('span');
            label.className = 'svg-label';
            label.textContent = 'תצוגת SVG';

            const actions = document.createElement('div');
            actions.className = 'svg-actions';

            const codeBox = document.createElement('pre');
            codeBox.className = 'svg-code';
            codeBox.textContent = cleanSvg;

            const toggleCodeBtn = document.createElement('button');
            toggleCodeBtn.type = 'button';
            toggleCodeBtn.className = 'mini-btn';
            toggleCodeBtn.textContent = 'הצג קוד';
            toggleCodeBtn.onclick = () => {
                const isOpen = codeBox.classList.toggle('open');
                toggleCodeBtn.textContent = isOpen ? 'הסתר קוד' : 'הצג קוד';
            };

            const downloadBtn = document.createElement('button');
            downloadBtn.type = 'button';
            downloadBtn.className = 'mini-btn';
            downloadBtn.textContent = 'הורד SVG';
            downloadBtn.onclick = () => {
                const blob = new Blob([cleanSvg], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'simulation-drawing.svg';
                a.click();
                URL.revokeObjectURL(url);
            };

            actions.append(toggleCodeBtn, downloadBtn);
            toolbar.append(label, actions);
            card.append(preview, toolbar, codeBox);
            return card;
        }

        function renderAssistantContent(bubble, text, isStreaming = false) {
            bubble.innerHTML = '';

            let displaySource = text;
            let hasIncompleteSvg = false;
            if (isStreaming) {
                const openIdx = text.lastIndexOf('<svg');
                const closeIdx = text.lastIndexOf('</svg>');
                if (openIdx !== -1 && openIdx > closeIdx) {
                    displaySource = text.slice(0, openIdx).trim();
                    hasIncompleteSvg = true;
                }
            }

            if (displaySource) {
                const parts = extractParts(displaySource);
                for (const part of parts) {
                    if (part.type === 'text') {
                        const p = document.createElement('div');
                        p.textContent = part.content;
                        bubble.appendChild(p);
                    } else if (part.type === 'svg') {
                        bubble.appendChild(createSvgCard(part.content));
                    }
                }
            }

            if (hasIncompleteSvg) {
                const drawingNote = document.createElement('div');
                drawingNote.style.color = 'var(--text-muted)';
                drawingNote.style.marginTop = '6px';
                drawingNote.textContent = 'מצייר SVG...';
                bubble.appendChild(drawingNote);
            }
        }

        function appendMessage(role, text, isError = false) {
            if (emptyStateEl) {
                emptyStateEl.style.display = 'none';
            }

            const row = document.createElement('div');
            row.className = `message-row ${role}${isError ? ' error' : ''}`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            if (role === 'assistant' && !isError) {
                renderAssistantContent(bubble, text, false);
            } else {
                bubble.textContent = text;
            }

            row.appendChild(bubble);
            chatMessagesEl.appendChild(row);
            chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
            return row;
        }

        async function handleSubmit(event) {
            event.preventDefault();
            const text = messageInput.value.trim();
            if (!text || isSending) return;

            isSending = true;
            sendBtn.disabled = true;
            messageInput.value = '';
            messageInput.style.height = 'auto';

            appendMessage('user', text);
            conversation.push({ role: 'user', text });

            const assistantRow = appendMessage('assistant', 'חושב...');
            const assistantBubble = assistantRow.querySelector('.bubble');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: conversation })
                });

                const contentType = (response.headers.get('content-type') || '').toLowerCase();

                if (!response.ok || contentType.includes('application/json')) {
                    const data = await response.json();
                    assistantRow.remove();
                    if (!response.ok || data.error) {
                        appendMessage('assistant', data.error || 'שגיאה בקבלת תשובה מהשרת.', true);
                        conversation.pop();
                    } else {
                        const reply = data.reply || '';
                        appendMessage('assistant', reply);
                        conversation.push({ role: 'assistant', text: reply });
                    }
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';
                let fullReply = '';
                let streamError = null;

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const rawLine of lines) {
                        const line = rawLine.trim();
                        if (!line.startsWith('data:')) continue;
                        const payloadStr = line.slice(5).trim();
                        if (!payloadStr) continue;

                        let payload;
                        try {
                            payload = JSON.parse(payloadStr);
                        } catch {
                            continue;
                        }

                        if (payload.error) {
                            streamError = payload.error;
                            break;
                        }
                        if (payload.text) {
                            fullReply += payload.text;
                            renderAssistantContent(assistantBubble, fullReply, true);
                            chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
                        }
                    }

                    if (streamError) break;
                }

                if (streamError) {
                    assistantRow.remove();
                    appendMessage('assistant', streamError, true);
                    conversation.pop();
                } else if (!fullReply.trim()) {
                    assistantRow.remove();
                    appendMessage('assistant', 'לא התקבלה תשובה מהמודל.', true);
                    conversation.pop();
                } else {
                    renderAssistantContent(assistantBubble, fullReply, false);
                    conversation.push({ role: 'assistant', text: fullReply });
                    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
                }
            } catch (err) {
                assistantRow.remove();
                appendMessage('assistant', 'לא ניתן להתחבר לשרת (/api/chat). אם האתר רץ על Vercel, ודא שהקובץ api/chat.js עלה ושמפתח GEMINI_API_KEY מוגדר.', true);
                conversation.pop();
            } finally {
                isSending = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }
    </script>
</body>
</html>
